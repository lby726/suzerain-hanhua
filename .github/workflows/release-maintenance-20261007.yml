name: Release v12 maintenance

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-maintenance-20261007.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    if: github.repository == 'lby726/suzerain-hanhua'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update verified v12 Release and dispatch monitor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          BASE = 'https://api.github.com/repos/lby726/suzerain-hanhua/'
          EXPECTED_DIGEST = 'sha256:087869eef8f0ce367c4f9691ea650617a19be3bf80e9a10f469f9f76474c9211'
          BODY = "适用版本：Windows 64 位 Steam 版，游戏构建 3.1.0.1.175，Steam Build 23568265。\n\n安装：退出游戏，将汉化 ZIP 放到 Suzerain.exe 所在文件夹，选择“解压到当前文件夹”，覆盖同名文件后启动游戏即可，无需切换语言。不要下载 Source code，不要解压到新的同名子文件夹。\n\n恢复英文：在 Steam 中验证游戏文件完整性。\n\n本版修复了进入第一章时的已知地图资源卡顿。部分地图字段为保证兼容保留英文；欢迎通过 Issues 反馈错译或游戏运行问题。\n\n作者：lby726\n项目地址：https://github.com/lby726/suzerain-hanhua\n\n汉化 ZIP 的 SHA-256：\n087869eef8f0ce367c4f9691ea650617a19be3bf80e9a10f469f9f76474c9211\n\n**Full Changelog**: https://github.com/lby726/suzerain-hanhua/commits/v12.0.0\n"
          
          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload, ensure_ascii=False).encode('utf-8')
              request = urllib.request.Request(BASE + path, data=data, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'suzerain-release-maintenance'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
              except urllib.error.HTTPError as error:
                  raise SystemExit(f'GitHub API returned HTTP {error.code}')
              return json.loads(raw) if raw else None
          
          release = api('GET', 'releases/405402875')
          asset = api('GET', 'releases/assets/617657059')
          if release['tag_name'] != 'v12.0.0' or release.get('immutable'):
              raise SystemExit('Unexpected release state; no changes made')
          if asset.get('digest') != EXPECTED_DIGEST or asset['size'] != 229270381:
              raise SystemExit('Asset integrity check failed; no changes made')
          updated = api('PATCH', 'releases/405402875', {'body': BODY})
          renamed = api('PATCH', 'releases/assets/617657059', {'name': 'Suzerain_zh-CN_v12.zip'})
          if updated.get('body') != BODY or renamed['name'] != 'Suzerain_zh-CN_v12.zip':
              raise SystemExit('Release update verification failed')
          if renamed.get('digest') != EXPECTED_DIGEST or renamed['size'] != 229270381:
              raise SystemExit('Unexpected asset integrity after rename')
          api('POST', 'actions/workflows/monitor-reuse.yml/dispatches', {'ref': 'main'})
          print('Release notes and asset name updated; archive digest unchanged; monitor dispatched.')
          PY
